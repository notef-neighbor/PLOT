name: Release signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve release version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${MANUAL_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version such as v0.1 or v0.1.0" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${release_tag#v}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Restore release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          required=(
            RELEASE_KEYSTORE_BASE64
            RELEASE_STORE_PASSWORD
            RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done
          keystore_path="${RUNNER_TEMP}/plot-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "RELEASE_STORE_FILE=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Test gateway
        working-directory: gateway
        run: |
          npm ci
          npm test -- --run

      - name: Download verified Codex App Server
        run: ./scripts/build-codex-android.sh

      - name: Test and build signed release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -f "${apk}"
          if [[ -z "${apksigner}" || ! -x "${apksigner}" ]]; then
            echo "Android SDK apksigner was not found" >&2
            exit 1
          fi
          "${apksigner}" verify --verbose --print-certs "${apk}"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PLOT.apk
          sha256sum dist/PLOT.apk > dist/PLOT.apk.sha256

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/PLOT.apk \
              dist/PLOT.apk.sha256 \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/PLOT.apk \
              dist/PLOT.apk.sha256 \
              --target "${GITHUB_SHA}" \
              --title "PLOT ${RELEASE_TAG}" \
              --generate-notes \
              --latest
          fi
